<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Тестування{% endblock %} | FaceID</title>
    {% load static %}
    <link rel="icon" href="{% static 'logo.jpg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --text: #1e293b; --muted: #64748b;
            --border: #e2e8f0; --success: #10b981; --error: #ef4444; --bg-soft: #f8fafc;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text); margin: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
        }
        .wrap { width: 100%; max-width: {% block width %}560px{% endblock %}; padding: 2.5rem 1.25rem; box-sizing: border-box; }
        .card {
            background: #fff; border-radius: 20px; padding: 2.25rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--primary), #818cf8);
        }
        h1 { margin: 0 0 .4rem; font-size: 1.6rem; color: #0f172a; }
        .muted { color: var(--muted); font-size: .9rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.25rem; font-size: .85rem; }
        .topbar a { color: var(--muted); text-decoration: none; }
        .badge { background: #eef2ff; color: var(--primary); padding: 4px 12px; border-radius: 99px; font-weight: 600; }
        .btn {
            display: inline-block; background: var(--primary); color: #fff; border: none; cursor: pointer;
            padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 1rem; text-decoration: none;
            text-align: center; transition: .2s; font-family: inherit; box-sizing: border-box;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: #e2e8f0; color: #0f172a; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-block { width: 100%; }
        .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.5rem; }
        .actions .btn { flex: 1; min-width: 160px; }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        {% block content %}{% endblock %}
    </div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
