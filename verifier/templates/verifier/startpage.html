<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceVerificationProject</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'logo.jpg' %}">

    <style>
        /* --- 1. CONFIGURATION & VARIABLES --- */
        :root {
            /* Palette */
            --primary-color: #4f46e5;       /* Indigo for primary actions */
            --primary-hover: #4338ca;
            --secondary-color: #64748b;     /* Slate for text */
            --bg-gradient-start: #f8fafc;
            --bg-gradient-end: #e2e8f0;
            --card-bg: #ffffff;
            
            /* Status Colors */
            --success-color: #10b981;
            --error-color: #ef4444;

            /* Spacing & Radius */
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap');

        /* --- 2. GLOBAL RESET --- */
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1, h2, h3 { margin: 0; font-weight: 700; color: #0f172a; }
        p { color: var(--secondary-color); }
        a { text-decoration: none; }

        /* --- 3. LAYOUT --- */
        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
        }

        .header-title {
            font-size: 2.5rem;
            text-align: center;
            background: -webkit-linear-gradient(45deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            width: 100%;
            justify-content: center;
        }

        /* --- 4. CARDS --- */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Decorative top border for cards */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-color), #818cf8);
        }

        .card h2 {
            margin-bottom: 2rem;
            font-size: 1.5rem;
            text-align: center;
        }

        .card-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* --- 5. BUTTONS --- */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
            text-align: center;
            display: inline-block;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(79, 70, 229, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

    </style>
</head>

<body>

    <div class="main-container">
        
        <h1 class="header-title">FaceVerificationProject</h1>

        <div class="cards-grid">
            <div class="card">
                <h2>Біометрична автентифікація</h2>
                <div class="card-actions">
                    <a href="{% url 'magisterjob' %}" style="width: 100%;">
                        <button class="btn">Реєстрація (Multi-Reference + 2FA)</button>
                    </a>
                    <a href="{% url 'user_list' %}" style="width: 100%;">
                        <button class="btn">Користувачі та вхід</button>
                    </a>
                </div>
            </div>

            <div class="card">
                <h2>Бенчмарк</h2>
                <div class="card-actions">
                    <a href="{% url 'benchmark_page' %}" style="width: 100%;">
                        <button class="btn">Метрики якості системи</button>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
